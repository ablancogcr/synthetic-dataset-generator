[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthetic-dataset-generator"
version = "0.1.0"
description = "Generate reproducible synthetic ecommerce datasets for analytics portfolios."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Synthetic Dataset Generator Contributors" }]
dependencies = [
  "faker>=24.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
viewer = [
  "plotly>=6.0",
  "streamlit>=1.57",
]

[project.scripts]
synthetic-dataset-generator = "synthetic_dataset_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_dataset_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
